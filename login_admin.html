<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#070707">
<title>لوحة الإدارة · TOPUP ZONE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--gold1:#ffe58f;--gold2:#f5b700;--gold3:#b97a00;--gold-grad:linear-gradient(135deg,#ffe58f 0%,#f5b700 45%,#b97a00 100%);
  --bg:#070707;--s1:#101010;--s2:#171717;--s3:#202020;--line:rgba(245,183,0,.16);--line2:rgba(255,255,255,.09);
  --text:#f5f5f5;--muted:#a3a3a3;--dim:#6b6b6b;--ok:#22c55e;--err:#ef4444;--info:#3b82f6;--r:14px;--ease:.25s cubic-bezier(.4,0,.2,1)}
html,body{min-height:100%}
body{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh;min-height:100dvh}
body::before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 400px at 90% 0,rgba(245,183,0,.12),transparent 70%),linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px) 0 0/44px 44px}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14.5px;color:var(--text)}
.hidden{display:none!important}:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}

/* ===== Buttons / Fields ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:12px;font-weight:800;font-size:14px;transition:var(--ease);position:relative;white-space:nowrap}
.btn-gold{background:var(--gold-grad);color:#1a1200;box-shadow:0 8px 22px rgba(245,183,0,.22)}.btn-gold:hover{transform:translateY(-2px)}
.btn-line{border:1.5px solid var(--line);background:rgba(255,255,255,.03)}.btn-line:hover{border-color:var(--gold2);color:var(--gold1)}
.btn-danger{border:1.5px solid rgba(239,68,68,.35);color:#fca5a5;background:rgba(239,68,68,.06)}.btn-danger:hover{background:rgba(239,68,68,.15)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn.loading{color:transparent;pointer-events:none}.btn.loading::after{content:'';position:absolute;width:18px;height:18px;border:2.5px solid rgba(0,0,0,.25);border-top-color:#1a1200;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.field{margin-bottom:14px}.field>label{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.field>label i{color:var(--err);font-style:normal}.field>label .h{color:var(--dim);font-weight:400}
.inp{width:100%;background:var(--s2);border:1.5px solid var(--line2);border-radius:11px;padding:11px 13px;outline:none;transition:var(--ease)}
.inp:focus{border-color:var(--gold2);box-shadow:0 0 0 4px rgba(245,183,0,.1)}.inp.err{border-color:var(--err);animation:shake .35s}
textarea.inp{resize:vertical;min-height:80px}.inp.ltr{direction:ltr;text-align:left}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(0% + 18px) 50%,calc(0% + 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-inline-start:34px}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ferr{color:#fca5a5;font-size:12px;margin-top:4px;display:none}
.pwrap{position:relative}.pwrap .inp{padding-inline-end:44px}.pwrap button{position:absolute;inset-inline-end:0;top:0;bottom:0;width:44px;color:var(--dim)}.pwrap button:hover{color:var(--gold2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.sw input{display:none}.sw i{width:40px;height:22px;border-radius:12px;background:var(--s3);border:1px solid var(--line2);position:relative;transition:var(--ease)}
.sw i::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:#888;transition:var(--ease)}
.sw input:checked+i{background:rgba(245,183,0,.25);border-color:var(--gold2)}.sw input:checked+i::after{background:var(--gold2);transform:translateX(-18px)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;margin-inline-end:12px}.chk input{accent-color:#f5b700}

/* ===== Auth screen ===== */
.auth{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:430px;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:26px;padding:34px 30px 28px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8);animation:rise .7s cubic-bezier(.16,1,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.98)}}
.sec-badge{display:flex;align-items:center;justify-content:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--gold1);background:rgba(245,183,0,.08);border:1px solid var(--line);padding:6px 12px;border-radius:99px;margin-bottom:22px}
.sec-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gold2);box-shadow:0 0 8px var(--gold2);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.4;transform:scale(1.4)}}
.shield{width:76px;height:76px;margin:0 auto 14px;display:grid;place-items:center}.shield img{width:100%;height:100%;object-fit:contain}
.auth-card h1{text-align:center;font-size:23px;font-weight:900;margin-bottom:4px}
.auth-card .sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:22px}
.alert{padding:10px 13px;border-radius:11px;font-size:13px;margin-bottom:14px;display:none;border:1px solid}
.alert.err{display:block;background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.35);color:#fca5a5}
.alert.info{display:block;background:rgba(245,183,0,.07);border-color:var(--line);color:var(--gold1)}
.auth-foot{text-align:center;margin-top:18px;padding-top:14px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--dim)}.auth-foot a:hover{color:var(--gold1)}

/* ===== Dashboard layout ===== */
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh;min-height:100dvh}
.side{position:sticky;top:0;height:100vh;height:100dvh;background:rgba(16,16,16,.92);border-inline-end:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.side .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;border-bottom:1px solid var(--line2);margin-bottom:10px}
.side .brand .mk{width:40px;height:40px;display:grid;place-items:center}.side .brand .mk img{width:100%;height:100%;object-fit:contain}
.side .brand b{display:block;line-height:1.1}.side .brand small{color:var(--muted);font-size:11px}
.nv{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;font-weight:700;font-size:14px;color:var(--muted);transition:var(--ease);text-align:start;width:100%}
.nv:hover{background:rgba(245,183,0,.07);color:var(--text)}.nv.on{background:var(--gold-grad);color:#1a1200}
.nv .c{margin-inline-start:auto;font-size:11px;background:var(--err);color:#fff;border-radius:99px;padding:1px 7px}
.nv.out{margin-top:auto;color:#fca5a5}
.main{padding:24px;min-width:0}
.topbar{display:none}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.page-h h1{font-size:24px;font-weight:900}.page-h p{color:var(--muted);font-size:13.5px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tools .inp{flex:1;min-width:180px}.tools select.inp{flex:0 0 auto;min-width:150px}

/* ===== Cards / tables ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.stat{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line2);border-radius:var(--r);padding:16px;transition:var(--ease)}
.stat:hover{border-color:var(--gold3);transform:translateY(-2px)}
.stat .l{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px}.stat .v{font-size:28px;font-weight:900;line-height:1.15}
.stat .v small{font-size:13px;color:var(--muted);font-weight:600;display:block}
.stat.gold .v{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.panel{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line2);border-radius:var(--r);padding:18px;margin-bottom:16px}
.panel h2{font-size:16px;font-weight:800;margin-bottom:12px}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--s2);border:1px solid var(--line2);border-radius:13px;flex-wrap:wrap;transition:var(--ease)}
.item:hover{border-color:var(--line)}.item.off{opacity:.55}
.thumb{width:54px;height:54px;border-radius:12px;overflow:hidden;flex-shrink:0;display:grid;place-items:center;font-size:24px;color:#fff}.thumb img{width:100%;height:100%;object-fit:cover}
.grow{flex:1;min-width:150px}.grow b{display:block;font-size:14.5px}.grow small{color:var(--muted);font-size:12.5px;display:block}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--gold1);background:rgba(245,183,0,.07)}
.st{font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:99px;border:1px solid;white-space:nowrap}
.st.new{color:#93c5fd;border-color:#3b82f666;background:#3b82f61a}.st.awaiting_payment{color:#fcd34d;border-color:#f59e0b66;background:#f59e0b1a}
.st.review{color:#c4b5fd;border-color:#8b5cf666;background:#8b5cf61a}.st.processing{color:#fdba74;border-color:#f9731666;background:#f973161a}
.st.done,.st.paid{color:#86efac;border-color:#22c55e66;background:#22c55e1a}.st.rejected,.st.failed{color:#fca5a5;border-color:#ef444466;background:#ef44441a}
.st.pending{color:#fcd34d;border-color:#f59e0b66;background:#f59e0b1a}
.order{background:var(--s2);border:1px solid var(--line2);border-radius:14px;padding:16px;margin-bottom:12px;animation:cin .35s}
@keyframes cin{from{opacity:0;transform:translateY(-6px)}}
.order.fresh{border-color:var(--gold2)}
.o-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start;margin-bottom:10px}
.o-h b{font-size:16px}.o-h small{display:block;color:var(--muted);font-size:12px}
.o-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.box{background:var(--s1);border:1px solid var(--line2);border-radius:11px;padding:11px;font-size:13px}
.box h4{font-size:11.5px;color:var(--dim);margin-bottom:6px;font-weight:700}.box div{color:var(--text);word-break:break-word}
.box .ltr{direction:ltr;text-align:right;font-family:monospace}
.receipt{max-height:90px;border-radius:8px;cursor:zoom-in;border:1px solid var(--line)}
.o-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.o-ctrl .inp{width:auto;min-width:150px;padding:8px 12px}
.empty{text-align:center;padding:48px 18px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}.empty .e{font-size:42px;margin-bottom:6px}.empty h3{color:var(--text);margin-bottom:4px}
.bars{display:grid;gap:10px}.bar-r{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;font-size:13px}
.bar-r .t{height:10px;background:var(--s3);border-radius:6px;overflow:hidden}.bar-r .t span{display:block;height:100%;background:var(--gold-grad);border-radius:6px;transition:width .6s}

/* ===== Modal / Toast ===== */
.modal{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
.modal .ov{position:absolute;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px)}
.sheet{position:relative;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:22px;animation:up .3s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.sheet-h h2{font-size:19px;font-weight:900}
.x{width:34px;height:34px;border-radius:10px;background:var(--s3);display:grid;place-items:center}.x:hover{background:var(--err)}
.upl{display:flex;align-items:center;gap:12px}.upl .thumb{background:var(--s3);color:var(--dim);font-size:20px}
.toasts{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:300;display:grid;gap:8px;width:calc(100% - 28px);max-width:380px;pointer-events:none}
.toast{background:var(--s3);border:1px solid var(--line);border-inline-start:4px solid var(--gold2);padding:11px 15px;border-radius:12px;font-weight:600;font-size:13.5px;box-shadow:0 12px 32px rgba(0,0,0,.6);animation:tin .3s}
.toast.ok{border-inline-start-color:var(--ok)}.toast.err{border-inline-start-color:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.live::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 1.8s infinite}
.lightbox img{max-width:100%;max-height:80vh;border-radius:12px;display:block;margin:auto}

/* ===== Responsive ===== */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:260px;z-index:70;transform:translateX(100%);transition:var(--ease)}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.7)}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;background:rgba(7,7,7,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px}
  .topbar .mb{width:40px;height:40px;border-radius:11px;background:var(--s2);border:1px solid var(--line2);font-size:18px}
  .topbar b{font-weight:900}
  .main{padding:16px 14px 40px}
  .o-grid,.two{grid-template-columns:1fr}
  .bar-r{grid-template-columns:100px 1fr 34px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ================= AUTH (إعداد أول مرة / تسجيل دخول) ================= -->
<div class="auth" id="authScreen">
  <div class="auth-card">
    <div class="sec-badge">بوابة محمية · دخول المسؤولين</div>
    <div class="shield" id="authLogo"></div>
    <h1 id="authTitle">لوحة تحكم المتجر</h1>
    <p class="sub" id="authSub">أدخل بيانات الدخول للوصول إلى لوحة الإدارة</p>
    <div class="alert" id="authAlert"></div>
    <form id="authForm" novalidate>
      <div class="field"><label for="aUser"><span>اسم المستخدم أو البريد <i>*</i></span></label><input class="inp ltr" id="aUser" autocomplete="username" placeholder="admin"><div class="ferr"></div></div>
      <div class="field"><label for="aPw"><span>كلمة المرور <i>*</i></span><span class="h" id="aPwHint"></span></label>
        <div class="pwrap"><input class="inp ltr" type="password" id="aPw" autocomplete="current-password" placeholder="••••••••"><button type="button" id="aEye" aria-label="إظهار كلمة المرور">👁</button></div><div class="ferr"></div></div>
      <div class="field hidden" id="aPw2Box"><label for="aPw2"><span>تأكيد كلمة المرور <i>*</i></span></label><input class="inp ltr" type="password" id="aPw2" autocomplete="new-password" placeholder="••••••••"><div class="ferr"></div></div>
      <button class="btn btn-gold btn-block" id="authBtn" type="submit" style="padding:13px">دخول آمن 🔒</button>
    </form>
    <div class="auth-foot"><a href="index.html">← العودة إلى المتجر</a></div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="app hidden" id="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mk" id="sideLogo"></span><div><b class="gold-text" id="sideName">TOPUP ZONE</b><small>لوحة الإدارة</small></div></div>
    <button class="nv on" data-view="stats">📊 الإحصائيات</button>
    <button class="nv" data-view="orders">🧾 الطلبات <span class="c hidden" id="newBadge">0</span></button>
    <button class="nv" data-view="products">🎮 المنتجات</button>
    <button class="nv" data-view="customers">👥 العملاء</button>
    <button class="nv" data-view="payments">💳 طرق الدفع</button>
    <button class="nv" data-view="offers">🏷️ العروض والخصومات</button>
    <button class="nv" data-view="settings">⚙️ الإعدادات</button>
    <a class="nv" href="index.html" target="_blank" rel="noopener">🌐 فتح المتجر</a>
    <button class="nv out" id="logoutBtn">⏻ تسجيل الخروج</button>
  </aside>
  <div>
    <div class="topbar"><button class="mb" id="menuBtn" aria-label="القائمة">☰</button><b class="gold-text" id="topTitle">الإحصائيات</b></div>
    <main class="main" id="view"></main>
  </div>
</div>

<div class="modal" id="modal"><div class="ov" data-act="closeModal"></div><div class="sheet" id="sheet"></div></div>
<div class="toasts" id="toasts"></div>

<script>
/* =====================================================
   ADMIN PANEL — واجهة أمامية تجريبية
   ⚠️ تنبيه أمني مهم:
   - لا توجد بيانات دخول داخل الكود. يُنشأ حساب المدير عند أول تشغيل ويُحفظ مجزّأً (PBKDF2) في المتصفح.
   - هذا ليس أمناً حقيقياً: أي شخص يفتح هذه الصفحة على جهازه يستطيع إنشاء "مدير" على متصفحه،
     والبيانات كلها في localStorage وقابلة للتعديل من أدوات المطوّر.
   - عند التشغيل الفعلي يجب نقل المصادقة والصلاحيات وتخزين المنتجات والطلبات إلى Backend آمن (HTTPS + جلسات/JWT + قاعدة بيانات).
===================================================== */
(function(){
'use strict';
const DB_KEY='tz_db_v1',ADMIN_KEY='tz_admin_v1',SESS_KEY='tz_admin_session';
const SESSION_MS=2*60*60*1000;
const RATE=2600;
const BRANDS={
  pubg:{name:'PUBG Mobile',cat:'games',icon:'🔫',c1:'#f5b700',c2:'#7a4b00',needs:['uid']},
  freefire:{name:'Free Fire',cat:'games',icon:'🔥',c1:'#ff7a18',c2:'#8a1f00',needs:['uid']},
  mlbb:{name:'Mobile Legends',cat:'games',icon:'⚔️',c1:'#3b82f6',c2:'#14275c',needs:['uid','server']},
  fcmobile:{name:'FC Mobile',cat:'games',icon:'⚽',c1:'#22c55e',c2:'#0b4a22',needs:['uid']},
  roblox:{name:'Roblox',cat:'games',icon:'🧱',c1:'#ef4444',c2:'#5a0f0f',needs:['username']},
  playstation:{name:'PlayStation',cat:'games',icon:'🎮',c1:'#2563eb',c2:'#0b1b4d',needs:['email']},
  xbox:{name:'Xbox',cat:'games',icon:'🟢',c1:'#16a34a',c2:'#063a1a',needs:['email']},
  steam:{name:'Steam',cat:'games',icon:'💨',c1:'#0ea5e9',c2:'#0a2a3d',needs:['email']},
  netflix:{name:'Netflix',cat:'subs',icon:'🎬',c1:'#e50914',c2:'#4a0307',needs:['email']},
  spotify:{name:'Spotify',cat:'subs',icon:'🎧',c1:'#1db954',c2:'#0b4d22',needs:['email']},
  shahid:{name:'Shahid',cat:'subs',icon:'📺',c1:'#a855f7',c2:'#3b0f66',needs:['email']},
  other_game:{name:'ألعاب أخرى',cat:'games',icon:'🕹️',c1:'#f5b700',c2:'#4a3000',needs:['uid']},

function compress(file,max=500,q=.78){return new Promise((res,rej)=>{if(!file.type.startsWith('image/'))return rej();const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}

const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unhex=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
async function hashPw(pw,saltHex){
  if(crypto?.subtle){const salt=saltHex?unhex(saltHex):crypto.getRandomValues(new Uint8Array(16));
    const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},key,256);return{salt:hex(salt),hash:hex(bits)}}
  const salt=saltHex||Math.random().toString(16).slice(2,18);let h=5381;const s=salt+pw;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return{salt,hash:h.toString(16)}}
const safeEq=(a,b)=>{if(a.length!==b.length)return false;let r=0;for(let i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0};
const getAdmin=()=>{try{return JSON.parse(localStorage.getItem(ADMIN_KEY))}catch{return null}};
const isAuthed=()=>{try{const s=JSON.parse(sessionStorage.getItem(SESS_KEY));return s&&s.exp>Date.now()}catch{return false}};
const strongPw=p=>p.length>=10&&/[A-Za-z]/.test(p)&&/\d/.test(p);
let fails=0,lockUntil=0;

function initAuth(){
  const setup=!getAdmin();
  $('#authLogo').innerHTML=logoHTML(76);
  $('#authTitle').innerHTML=setup?'إعداد حساب <span class="gold-text">المدير</span>':'لوحة تحكم <span class="gold-text">المتجر</span>';
  $('#authSub').textContent=setup?'أنشئ بيانات دخول المدير (تظهر هذه الشاشة مرة واحدة فقط)':'أدخل بيانات الدخول للوصول إلى لوحة الإدارة';
  $('#aPw2Box').classList.toggle('hidden',!setup);
  $('#aPwHint').textContent=setup?'10 أحرف على الأقل مع أرقام':'';
  $('#authBtn').textContent=setup?'إنشاء الحساب والدخول':'دخول آمن 🔒';
  $('#aPw').autocomplete=setup?'new-password':'current-password';
  if(setup){const a=$('#authAlert');a.className='alert info';a.textContent='لا توجد بيانات دخول مضمّنة في الكود. اختر اسم مستخدم وكلمة مرور قوية وتذكّرها.'}
}
$('#aEye').onclick=()=>{const i=$('#aPw'),s=i.type==='password';i.type=s?'text':'password';$('#aEye').textContent=s?'🙈':'👁'};
$('#authForm').addEventListener('submit',async e=>{
  e.preventDefault();clearErr(e.target);const al=$('#authAlert');
  const u=$('#aUser'),p=$('#aPw'),p2=$('#aPw2'),setup=!getAdmin();let ok=true;
  if(u.value.trim().length<3){ferr(u,'اسم المستخدم 3 أحرف على الأقل.');ok=false}
  if(!p.value){ferr(p,'أدخل كلمة المرور.');ok=false}
  if(setup){
    if(p.value&&!strongPw(p.value)){ferr(p,'كلمة المرور يجب أن تكون 10 أحرف على الأقل وتحتوي حروفاً وأرقاماً.');ok=false}
    if(p2.value!==p.value){ferr(p2,'كلمتا المرور غير متطابقتين.');ok=false}
  }
  if(!ok)return;
  if(!setup&&Date.now()<lockUntil){al.className='alert err';al.textContent=`محاولات كثيرة. انتظر ${Math.ceil((lockUntil-Date.now())/1000)} ثانية.`;return}
  const btn=$('#authBtn');setLoad(btn,true);
  try{
    await delay(450);
    if(setup){
      const h=await hashPw(p.value);
      try{localStorage.setItem(ADMIN_KEY,JSON.stringify({user:u.value.trim().toLowerCase(),...h,createdAt:Date.now()}))}catch{toast('تعذّر الحفظ','err');return}
    }else{
      const a=getAdmin(),h=await hashPw(p.value,a.salt);
      if(!(a.user===u.value.trim().toLowerCase()&&safeEq(h.hash,a.hash))){
        fails++;if(fails>=5){lockUntil=Date.now()+60000;fails=0}
        al.className='alert err';al.textContent='اسم المستخدم أو كلمة المرور غير صحيحة.';p.value='';p.focus();return}
    }
    fails=0;sessionStorage.setItem(SESS_KEY,JSON.stringify({exp:Date.now()+SESSION_MS}));
    p.value='';p2.value='';al.className='alert';showApp();toast('مرحباً بك في لوحة التحكم','ok');
  }finally{setLoad(btn,false)}
});

  <div class="field"><label>اسم المنتج <i>*</i></label><input class="inp" id="fName" value="${esc(p.name)}" maxlength="70" placeholder="يُولَّد تلقائياً إن تُرك فارغاً"><div class="ferr"></div></div>
  <div class="field"><label>وصف مختصر</label><textarea class="inp" id="fDesc" maxlength="160">${esc(p.desc)}</textarea></div>
  <div class="two"><div class="field"><label>السعر بالجنيه (ج.س)</label><input class="inp ltr" id="fSdg" type="number" min="0" step="1" value="${p.priceSDG}"><div class="ferr"></div></div>
  <div class="field"><label>السعر بالدولار ($)</label><input class="inp ltr" id="fUsd" type="number" min="0" step="0.01" value="${p.priceUSD}"></div></div>
  <div class="two"><div class="field"><label>الشارة</label><select class="inp" id="fFlag"><option value="">بدون</option><option value="best" ${p.flag==='best'?'selected':''}>الأكثر مبيعاً</option><option value="new" ${p.flag==='new'?'selected':''}>جديد</option></select></div>
  <div class="field"><label>نص شارة مخصص <span class="h">اختياري</span></label><input class="inp" id="fBadge" value="${esc(p.badge)}" maxlength="20"></div></div>
  <div class="field"><label>البيانات المطلوبة من العميل <span class="h">لا تطلب كلمة مرور اللعبة أبداً</span></label>
    <div id="fNeeds">${Object.entries(FIELDS).map(([k,l])=>`<label class="chk"><input type="checkbox" value="${k}" ${(p.needs||[]).includes(k)?'checked':''}> ${l}</label>`).join('')}</div></div>
  <div class="field"><label>صورة المنتج <span class="h">اختياري — وإلا تُستخدم بطاقة بألوان اللعبة</span></label>
    <div class="upl"><div class="thumb" id="fImgPrev">${p.image?`<img src="${esc(p.image)}" alt="">`:'🖼️'}</div><label class="btn btn-line btn-sm" for="fImg">رفع صورة</label><input type="file" id="fImg" accept="image/*" hidden><button type="button" class="btn btn-danger btn-sm" id="fImgClr">إزالة</button></div></div>
  <label class="sw" style="margin-bottom:16px"><input type="checkbox" id="fActive" ${p.active?'checked':''}><i></i>المنتج مفعّل ويظهر في المتجر</label>
  <button class="btn btn-gold btn-block" type="submit">${isNew?'إضافة المنتج':'حفظ التعديلات'}</button></form>`);
  let img=p.image||'';
  $('#fBrand').onchange=e=>{const b=BRANDS[e.target.value];$$('#fNeeds input').forEach(i=>i.checked=b.needs.includes(i.value))};
  $('#fImg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{img=await compress(f);$('#fImgPrev').innerHTML=`<img src="${img}" alt="">`}catch{toast('الملف ليس صورة صالحة','err')}};
  $('#fImgClr').onclick=()=>{img='';$('#fImgPrev').textContent='🖼️'};
  $('#pForm').onsubmit=e=>{
    e.preventDefault();clearErr(e.target);if(!guard())return;let ok=true;
    const brand=$('#fBrand').value,tag=$('#fTag').value.trim(),sdg=Number($('#fSdg').value)||0,usd=Number($('#fUsd').value)||0;
    if(!tag){ferr($('#fTag'),'أدخل الفئة أو الكمية.');ok=false}
    if(sdg<=0&&usd<=0){ferr($('#fSdg'),'أدخل سعراً بالجنيه أو بالدولار على الأقل.');ok=false}
    if(sdg<0||usd<0){ok=false}
    if(!ok)return;
    const rate=Number(DB.settings.rate)||RATE;
    const data={brand,cat:BRANDS[brand].cat,tag,name:$('#fName').value.trim()||(BRANDS[brand].name+' — '+tag),desc:$('#fDesc').value.trim(),
      priceSDG:sdg||Math.round(usd*rate),priceUSD:usd||Math.round(sdg/rate*100)/100,flag:$('#fFlag').value,badge:$('#fBadge').value.trim(),
      active:$('#fActive').checked,needs:$$('#fNeeds input:checked').map(i=>i.value),image:img};
    if(e.target.dataset.id){Object.assign(DB.products.find(x=>x.id===e.target.dataset.id),data)}
    else DB.products.push({id:'p'+Date.now().toString(36),...data});
    if(save()){closeModal();render();toast('تم حفظ المنتج','ok')}
  };
}

function offerForm(o){
  const isNew=!o;o=o||{title:'',desc:'',code:'',percent:10,active:true};
  modal(`<div class="sheet-h"><h2>${isNew?'إضافة عرض':'تعديل العرض'}</h2><button class="x" data-act="closeModal">✕</button></div>
  <form id="offForm" novalidate data-id="${o.id||''}">
  <div class="field"><label>عنوان العرض <i>*</i></label><input class="inp" id="gTitle" value="${esc(o.title)}" maxlength="50"><div class="ferr"></div></div>
  <div class="field"><label>الوصف</label><input class="inp" id="gDesc" value="${esc(o.desc)}" maxlength="120"></div>
  <div class="two"><div class="field"><label>كود الخصم <i>*</i></label><input class="inp ltr" id="gCode" value="${esc(o.code)}" maxlength="20" style="text-transform:uppercase"><div class="ferr"></div></div>
  <div class="field"><label>نسبة الخصم % <i>*</i></label><input class="inp ltr" id="gPct" type="number" min="1" max="90" value="${o.percent}"><div class="ferr"></div></div></div>
  <label class="sw" style="margin-bottom:16px"><input type="checkbox" id="gAct" ${o.active?'checked':''}><i></i>فعّال</label>
  <button class="btn btn-gold btn-block" type="submit">حفظ</button></form>`);
  $('#offForm').onsubmit=e=>{e.preventDefault();clearErr(e.target);if(!guard())return;let ok=true;
    const code=$('#gCode').value.trim().toUpperCase(),pct=Number($('#gPct').value),id=e.target.dataset.id;
    if(!$('#gTitle').value.trim()){ferr($('#gTitle'),'أدخل عنواناً.');ok=false}
    if(!/^[A-Z0-9_\-]{3,20}$/.test(code)){ferr($('#gCode'),'الكود 3–20 حرفاً إنجليزياً أو أرقاماً.');ok=false}
    else if(DB.offers.some(x=>x.code.toUpperCase()===code&&x.id!==id)){ferr($('#gCode'),'هذا الكود مستخدم.');ok=false}
    if(!(pct>=1&&pct<=90)){ferr($('#gPct'),'النسبة بين 1 و 90.');ok=false}if(!ok)return;
    const d={title:$('#gTitle').value.trim(),desc:$('#gDesc').value.trim(),code,percent:pct,active:$('#gAct').checked};
    if(id)Object.assign(DB.offers.find(x=>x.id===id),d);else DB.offers.push({id:'o'+Date.now().toString(36),...d});
    if(save()){closeModal();render();toast('تم حفظ العرض','ok')}};
}

/* =====================================================
   EVENTS (delegation)
===================================================== */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act],[data-view]');if(!el)return;
  if(el.dataset.view){go(el.dataset.view);return}
  const a=el.dataset.act,id=el.dataset.id;
  const needAuth=!['closeModal','zoom'].includes(a);
  if(needAuth&&!['setStatus','setPay','togProduct','togPay','togOffer'].includes(a)&&!guard())return;
  const find=(arr)=>DB[arr].find(x=>x.id===id);
  switch(a){
    case 'closeModal':closeModal();break;
    case 'addProduct':productForm();break;case 'editProduct':productForm(find('products'));break;
    case 'delProduct':if(confirm('حذف هذا المنتج نهائياً؟')){DB.products=DB.products.filter(x=>x.id!==id);save();render();toast('تم حذف المنتج')}break;
    case 'addPay':payForm();break;case 'editPay':payForm(find('payments'));break;
    case 'delPay':if(confirm('حذف وسيلة الدفع؟')){DB.payments=DB.payments.filter(x=>x.id!==id);save();render();toast('تم الحذف')}break;
    case 'addOffer':offerForm();break;case 'editOffer':offerForm(find('offers'));break;
    case 'delOffer':if(confirm('حذف العرض؟')){DB.offers=DB.offers.filter(x=>x.id!==id);save();render();toast('تم الحذف')}break;
    case 'delOrder':if(confirm('حذف هذا الطلب نهائياً؟')){DB.orders=DB.orders.filter(x=>x.id!==id);save();render();toast('تم حذف الطلب')}break;
    case 'zoom':{const o=DB.orders.find(x=>x.id===el.dataset.srcOid);if(o?.receipt)modal(`<div class="sheet-h"><h2>إيصال الدفع · ${esc(o.no)}</h2><button class="x" data-act="closeModal">✕</button></div><div class="lightbox"><img src="${esc(o.receipt)}" alt="الإيصال"></div>`);break}
    case 'custOrders':{const u=find('users'),os=DB.orders.filter(o=>o.userId===id).sort((a,b)=>b.createdAt-a.createdAt);
      modal(`<div class="sheet-h"><h2>طلبات ${esc(u?.name||'')}</h2><button class="x" data-act="closeModal">✕</button></div>${os.length?`<div class="list">${os.map(o=>`<div class="item"><div class="grow"><b>${esc(o.no)}</b><small>${dt(o.createdAt)}</small><small>${o.items.map(i=>esc(i.name)+' ×'+i.qty).join('، ')}</small></div><span class="st ${o.status}">${STATUS[o.status]}</span><b>${fmt(o.total,o.currency)}</b></div>`).join('')}</div>`:'<div class="empty"><h3>لا توجد طلبات لهذا العميل</h3></div>'}`);break}
    case 'clearLogo':DB.settings.logo='';$('#sLogoPrev').textContent='🖼️';break;
    case 'recalc':{const r=Number($('#sRate').value);if(!(r>0)){toast('أدخل سعر صرف صحيحاً','err');break}
      if(!confirm(`سيتم تحديث سعر الجنيه لكل المنتجات = السعر بالدولار × ${r}. متابعة؟`))break;
      DB.settings.rate=r;DB.products.forEach(p=>{if(p.priceUSD>0)p.priceSDG=Math.round(p.priceUSD*r)});if(save())toast('تم تحديث الأسعار','ok');break}
    case 'export':{const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),a2=document.createElement('a');a2.href=URL.createObjectURL(blob);a2.download='topupzone-backup-'+new Date().toISOString().slice(0,10)+'.json';a2.click();setTimeout(()=>URL.revokeObjectURL(a2.href),1000);break}
    case 'resetDemo':if(confirm('سيتم مسح المنتجات والطلبات والعملاء والإعدادات وإعادة البيانات التجريبية. متابعة؟')){const adminKeep=localStorage.getItem(ADMIN_KEY);DB=defaults();save();if(adminKeep)localStorage.setItem(ADMIN_KEY,adminKeep);knownOrders=new Set();render();toast('تمت إعادة البيانات التجريبية','ok')}break;
  }
});
document.addEventListener('change',async e=>{
  const t=e.target,a=t.dataset?.act,id=t.dataset?.id;
  if(a==='setStatus'||a==='setPay'||a==='togProduct'||a==='togPay'||a==='togOffer'){
    if(!guard())return;
    if(a==='setStatus'){const o=DB.orders.find(x=>x.id===id);if(o){o.status=t.value;o.updatedAt=Date.now();save();toast('تم تحديث حالة الطلب','ok');render()}}
    if(a==='setPay'){const o=DB.orders.find(x=>x.id===id);if(o){o.payStatus=t.value;o.updatedAt=Date.now();save();toast('تم تحديث حالة الدفع','ok');render()}}
    if(a==='togProduct'){const p=DB.products.find(x=>x.id===id);if(p){p.active=t.checked;save();render()}}
    if(a==='togPay'){const p=DB.payments.find(x=>x.id===id);if(p){p.active=t.checked;save();render()}}
    if(a==='togOffer'){const p=DB.offers.find(x=>x.id===id);if(p){p.active=t.checked;save();render()}}
    return;
  }
  if(t.id==='oF'){orderFilter=t.value;render()}
  if(t.id==='pC'){prodCat=t.value;render()}
  if(t.id==='sLogoF'){const f=t.files[0];if(!f)return;try{DB.settings.logo=await compress(f,400,.9);$('#sLogoPrev').innerHTML=`<img src="${DB.settings.logo}" alt="">`;toast('تم اختيار الشعار — اضغط «حفظ الإعدادات»')}catch{toast('الملف ليس صورة صالحة','err')}}
  if(t.id==='impF'){const f=t.files[0];if(!f||!guard())return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.products)||!Array.isArray(d.orders))throw 0;if(!confirm('سيتم استبدال البيانات الحالية بالنسخة المستوردة. متابعة؟'))return;localStorage.setItem(DB_KEY,JSON.stringify(d));DB=load();render();toast('تم الاستيراد','ok')}catch{toast('ملف غير صالح','err')}t.value=''}
});
document.addEventListener('input',e=>{
  const t=e.target;
  const keep=()=>{const p=t.selectionStart;render();const n=$('#'+t.id);if(n){n.focus();try{n.setSelectionRange(p,p)}catch{}}};
  if(t.id==='oQ'){orderQ=t.value;keep()}if(t.id==='pQ'){prodQ=t.value;keep()}if(t.id==='cQ'){custQ=t.value;keep()}
});
document.addEventListener('submit',async e=>{
  if(e.target.id==='setForm'){
    e.preventDefault();clearErr(e.target);if(!guard())return;let ok=true;
    const name=$('#sName'),wa=$('#sWa'),em=$('#sEmail'),rate=$('#sRate');
    if(name.value.trim().length<2){ferr(name,'أدخل اسم المتجر.');ok=false}
    if(!/^\d{9,15}$/.test(wa.value.replace(/\D/g,''))){ferr(wa,'أدخل رقم واتساب صحيحاً بصيغة دولية.');ok=false}
    if(em.value.trim()&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())){ferr(em,'بريد غير صحيح.');ok=false}
    if(!(Number(rate.value)>0)){ferr(rate,'أدخل سعر صرف أكبر من صفر.');ok=false}
    if(!ok)return;
    Object.assign(DB.settings,{storeName:name.value.trim(),tagline:$('#sTag').value.trim(),whatsapp:wa.value.replace(/\D/g,''),email:em.value.trim(),telegram:$('#sTg').value.trim().replace('@',''),currencyMode:$('#sMode').value,defaultCurrency:$('#sDef').value,rate:Number(rate.value)});
    if(save()){render();toast('تم حفظ الإعدادات','ok')}
  }
  if(e.target.id==='pwForm'){
    e.preventDefault();clearErr(e.target);if(!guard())return;const o=$('#cpOld'),n=$('#cpNew');let ok=true;
    const a=getAdmin(),h=await hashPw(o.value,a.salt);
    if(!safeEq(h.hash,a.hash)){ferr(o,'كلمة المرور الحالية غير صحيحة.');ok=false}
    if(!strongPw(n.value)){ferr(n,'10 أحرف على الأقل مع حروف وأرقام.');ok=false}
    if(!ok)return;const nh=await hashPw(n.value);
    localStorage.setItem(ADMIN_KEY,JSON.stringify({...a,...nh}));o.value='';n.value='';toast('تم تغيير كلمة المرور','ok');
  }
});
$('#logoutBtn').onclick=logout;
$('#menuBtn').onclick=()=>$('#side').classList.toggle('open');
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ---- Live sync: طلبات جديدة من index.html ---- */
function sync(){
  if(!isAuthed()||$('#app').classList.contains('hidden'))return;
  const fresh=load();
  const nw=fresh.orders.filter(o=>!knownOrders.has(o.id));
  const changed=JSON.stringify(fresh.orders)!==JSON.stringify(DB.orders)||fresh.users.length!==DB.users.length;
  if(!changed)return;
  DB=fresh;
  nw.forEach(o=>toast(`📥 طلب جديد ${o.no} من ${o.customer.name}`,'ok'));
  if(!modalOpen()&&['stats','orders','customers'].includes(view)&&!document.activeElement?.closest('input,select,textarea'))render();
  else{const n=DB.orders.filter(o=>o.status==='new'||o.status==='review').length;const nb=$('#newBadge');nb.textContent=n;nb.classList.toggle('hidden',!n)}
  if(nw.length)setTimeout(()=>nw.forEach(o=>knownOrders.add(o.id)),4000);
}
window.addEventListener('storage',e=>{if(e.key===DB_KEY)sync()});
setInterval(()=>{sync();if(!isAuthed()&&!$('#app').classList.contains('hidden'))guard()},3000);

/* ---- Init ---- */
if(isAuthed())showApp();else initAuth();
})();
</script>
